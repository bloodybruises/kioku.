<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kioku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&family=Yuji+Syuku&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FBF6F3; --surface:#FFFFFF; --pink-soft:#F3D2D6; --pink-deep:#DE9FA9;
    --grey-soft:#E3DDD9; --grey-deep:#B7ADA9; --ink:#4A3B3C; --ink-light:#948382;
    --line:#EBE2DE; --accent:#DE9FA9; --accent-soft:#F3D2D6; --radius:20px;
    --font-display:"Shippori Mincho", serif; --font-body:"Zen Maru Gothic", sans-serif;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{ height:100%; margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); overflow-x:hidden; }
  #app{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; position:relative;}

  .topbar{ position:sticky; top:0; z-index:20; padding:14px 18px 10px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:linear-gradient(180deg, var(--bg) 80%, transparent); display:flex; align-items:center; justify-content:space-between; }
  .wordmark{ font-family:var(--font-display); font-size:22px; letter-spacing:2px; color:var(--ink); font-weight:600; display:flex; align-items:baseline; gap:6px; }
  .wordmark .kana{ font-size:13px; color:var(--accent); letter-spacing:1px; font-family:"Klee One",sans-serif; }
  .icon-btn{ width:36px;height:36px;border-radius:50%;border:1px solid var(--line); background:var(--surface); display:flex;align-items:center;justify-content:center; font-size:16px; cursor:pointer; color:var(--ink); }

  .screen{ padding:0 16px 90px; flex:1; }
  .screen.hidden{display:none;}
  .tabs{ display:flex; gap:6px; padding:2px 16px 14px; overflow-x:auto; }
  .tab-chip{ flex:none; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:13px; color:var(--ink-light); cursor:pointer; white-space:nowrap; }
  .tab-chip.active{ background:var(--accent-soft); color:var(--ink); border-color:var(--accent); font-weight:700;}

  .feed{ columns:2; column-gap:12px; }
  .card{ break-inside:avoid; margin-bottom:12px; background:var(--surface); border-radius:var(--radius); border:1px solid var(--line); overflow:hidden; box-shadow:0 2px 10px rgba(74,59,60,0.05); }
  .card .media{ width:100%; display:block; object-fit:cover; }
  .card .body{ padding:10px 12px 12px; }
  .card .cap{ font-size:13px; line-height:1.4; margin:0 0 8px; }
  .card .meta{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-light); margin-bottom:8px;}
  .avatar{ width:20px;height:20px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:11px; flex:none; }
  .card .actions{ display:flex; gap:14px; align-items:center; }
  .act{ background:none; border:none; font-size:13px; color:var(--ink-light); cursor:pointer; display:flex; align-items:center; gap:4px; font-family:var(--font-body); padding:0;}
  .act.liked{ color:var(--pink-deep); }
  .act.reposted{ color:#8FA98C; }
  .thread-card .body{ padding:14px; }
  .thread-card .cap{ font-size:14px; font-weight:600; }

  .banner{ height:120px; border-radius:0 0 26px 26px; position:relative; margin:0 -16px; }
  .profile-head{ padding:0 4px; margin-top:-40px; position:relative;}
  .p-avatar{ width:76px;height:76px;border-radius:50%; border:4px solid var(--bg); display:flex;align-items:center;justify-content:center; font-size:32px; }
  .p-name{ font-family:var(--font-display); font-size:20px; margin:10px 0 0; }
  .p-handle{ font-size:12.5px; color:var(--ink-light); margin:2px 0 8px;}
  .p-bio{ font-size:13.5px; line-height:1.5; margin:0 0 10px; }
  .now-playing{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:8px 12px; font-size:12.5px; margin-bottom:12px; }
  .now-playing .bars{ display:flex; gap:2px; align-items:flex-end; height:14px; }
  .now-playing .bars span{ width:3px; background:var(--accent); border-radius:2px; animation:bounce 1s infinite ease-in-out; }
  .now-playing .bars span:nth-child(2){ animation-delay:.2s;}
  .now-playing .bars span:nth-child(3){ animation-delay:.4s;}
  @keyframes bounce{ 0%,100%{height:4px;} 50%{height:14px;} }
  .edit-btn{ width:100%; padding:10px; border-radius:14px; border:1px solid var(--line); background:var(--surface); font-weight:700; font-size:13.5px; color:var(--ink); cursor:pointer; margin-bottom:14px; }
  .p-tabs{ display:flex; gap:18px; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .p-tab{ padding:8px 2px; font-size:13px; color:var(--ink-light); cursor:pointer; border-bottom:2px solid transparent; }
  .p-tab.active{ color:var(--ink); border-color:var(--accent); font-weight:700; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .grid3 .cell{ aspect-ratio:1; border-radius:8px; overflow:hidden; }
  .grid3 .cell img{ width:100%; height:100%; object-fit:cover; }
  .collections-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .collection-card{ border-radius:16px; padding:14px 12px; color:#fff; min-height:86px; position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; }
  .collection-card .cname{ font-family:var(--font-display); font-size:14px; }
  .add-collection{ border-radius:16px; border:1.5px dashed var(--grey-deep); min-height:86px; display:flex; align-items:center; justify-content:center; color:var(--ink-light); font-size:13px; cursor:pointer; background:transparent; }

  .navbar{ position:fixed; bottom:0; left:0; right:0; z-index:30; max-width:480px; margin:0 auto; background:var(--surface); border-top:1px solid var(--line); display:flex; justify-content:space-around; align-items:center; padding:9px 0 calc(9px + env(safe-area-inset-bottom,0px)); }
  .nav-btn{ background:none; border:none; font-size:20px; color:var(--ink-light); cursor:pointer; padding:4px 10px; }
  .nav-btn.active{ color:var(--accent); }
  .nav-btn.fab{ background:var(--accent); color:#fff; width:42px;height:42px;border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:20px; margin-top:-14px; box-shadow:0 4px 14px rgba(222,159,169,0.5); }

  .overlay{ position:fixed; inset:0; background:rgba(36,30,31,0.4); z-index:50; display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .2s; }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{ background:var(--bg); width:100%; max-width:480px; margin:0 auto; border-radius:22px 22px 0 0; padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px)); max-height:82vh; overflow-y:auto; transform:translateY(100%); transition:transform .25s ease; }
  .overlay.show .sheet{ transform:translateY(0); }
  .sheet h3{ font-family:var(--font-display); margin:0 0 14px; font-size:18px; }
  .field-label{ font-size:12px; color:var(--ink-light); margin:14px 0 6px; display:block; }
  .field-label:first-of-type{ margin-top:0; }
  textarea, input{ width:100%; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-family:var(--font-body); font-size:13.5px; background:var(--surface); color:var(--ink); resize:none; }
  .swatch-row{ display:flex; gap:10px; }
  .swatch{ width:36px;height:36px;border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .swatch.sel{ border-color:var(--ink); }
  .font-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .font-opt{ border:1px solid var(--line); border-radius:12px; padding:10px 14px; cursor:pointer; font-size:15px; background:var(--surface); }
  .font-opt.sel{ border-color:var(--accent); background:var(--accent-soft); }
  .banner-row{ display:flex; gap:10px; }
  .banner-opt{ width:56px; height:34px; border-radius:8px; cursor:pointer; border:2px solid transparent; flex:none; }
  .banner-opt.sel{ border-color:var(--ink); }
  .emoji-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .emoji-opt{ width:38px;height:38px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:18px; background:var(--grey-soft); cursor:pointer; border:2px solid transparent; }
  .emoji-opt.sel{ border-color:var(--accent); }
  .primary-btn{ width:100%; padding:12px; border-radius:14px; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:14px; cursor:pointer; margin-top:18px; }
  .composer-type-row{ display:flex; gap:8px; margin-bottom:6px;}
  .type-chip{ padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:12.5px; cursor:pointer; color:var(--ink-light);}
  .type-chip.sel{ background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:700;}
  .section-title{ font-family:var(--font-display); font-size:16px; margin:6px 0 10px; }
  .empty{ text-align:center; padding:40px 20px; color:var(--ink-light); font-size:13px; }
  .error-text{ color:#B85C5C; font-size:12.5px; margin-top:8px; }
  .authlink{ text-align:center; font-size:12.5px; color:var(--ink-light); margin-top:14px; }
  .authlink b{ color:var(--accent); cursor:pointer; }

  /* ---- auth screen ---- */
  #authScreen{ position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; }
  #authScreen.hidden{ display:none; }
  .auth-card{ width:100%; max-width:360px; }
  .auth-card h1{ font-family:var(--font-display); text-align:center; font-size:26px; margin:0 0 4px; }
  .auth-card p.tagline{ text-align:center; color:var(--ink-light); font-size:13px; margin:0 0 24px; }
  .auth-card .field-label{ margin-top:12px; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="auth-card">
    <h1>kioku</h1>
    <div class="composer-type-row" style="justify-content:center;">
      <div class="type-chip sel" data-authmode="login">log in</div>
      <div class="type-chip" data-authmode="signup">sign up</div>
    </div>
    <div id="signupFields" style="display:none;">
      <span class="field-label">handle</span>
      <input type="text" id="authHandle" placeholder="e.g. hana">
    </div>
    <span class="field-label">email</span>
    <input type="email" id="authEmail" placeholder="you@example.com">
    <span class="field-label">password</span>
    <input type="password" id="authPassword" placeholder="at least 6 characters">
    <button class="primary-btn" id="authSubmit">log in</button>
    <p class="error-text" id="authError"></p>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="wordmark">kioku</div>
    <button class="icon-btn" id="logoutBtn" title="Log out">⎋</button>
  </div>

  <div class="screen" id="screen-home">
    <div class="tabs"><div class="tab-chip active">for you</div><div class="tab-chip">new</div></div>
    <div class="feed" id="feed"></div>
  </div>

  <div class="screen hidden" id="screen-explore">
    <div class="section-title">boards</div>
    <div class="tabs" id="boardTabs"></div>
    <div class="feed" id="exploreFeed"></div>
  </div>

  <div class="screen hidden" id="screen-profile">
    <div class="banner" id="profileBanner"></div>
    <div class="profile-head">
      <div class="p-avatar" id="pAvatar"></div>
      <div class="p-name" id="pName"></div>
      <div class="p-handle" id="pHandle"></div>
      <div class="p-bio" id="pBio"></div>
      <div class="now-playing" id="nowPlayingBox"></div>
      <button class="edit-btn" id="editProfileBtn">edit profile</button>
      <div class="p-tabs">
        <div class="p-tab active" data-ptab="posts">posts</div>
        <div class="p-tab" data-ptab="collections">collections</div>
        <div class="p-tab" data-ptab="reposts">reposts</div>
      </div>
      <div id="pTabContent"></div>
    </div>
  </div>

  <div class="navbar">
    <button class="nav-btn active" data-screen="home">⌂</button>
    <button class="nav-btn" data-screen="explore">◎</button>
    <button class="nav-btn fab" id="composeBtn">＋</button>
    <button class="nav-btn" data-screen="profile">☺</button>
  </div>
</div>

<div class="overlay" id="composeOverlay">
  <div class="sheet">
    <h3>new post</h3>
    <div class="composer-type-row">
      <div class="type-chip sel" data-ctype="text">thought</div>
      <div class="type-chip" data-ctype="image">image</div>
    </div>
    <textarea id="composeText" rows="4" placeholder="what's on your mind..."></textarea>
    <div id="imageUploadWrap" style="display:none;">
      <span class="field-label">photo</span>
      <input type="file" id="composeImageFile" accept="image/*">
      <img id="composePreview" style="display:none; width:100%; border-radius:12px; margin-top:10px;">
    </div>
    <span class="field-label">post to board</span>
    <div class="tabs" id="composeBoards" style="padding:0;"></div>
    <button class="primary-btn" id="submitPost">post it</button>
    <p class="error-text" id="composeError"></p>
  </div>
</div>

<div class="overlay" id="editOverlay">
  <div class="sheet">
    <h3>customize profile</h3>
    <span class="field-label">display name</span>
    <input type="text" id="editName">
    <span class="field-label">bio</span>
    <textarea id="editBio" rows="2"></textarea>
    <span class="field-label">currently playing (song · artist)</span>
    <input type="text" id="editSong" placeholder="e.g. Plastic Love · Mariya Takeuchi">
    <span class="field-label">avatar</span>
    <div class="emoji-row" id="avatarPicker"></div>
    <span class="field-label">accent color</span>
    <div class="swatch-row" id="accentPicker"></div>
    <span class="field-label">banner style</span>
    <div class="banner-row" id="bannerPicker"></div>
    <span class="field-label">profile font</span>
    <div class="font-row" id="fontPicker"></div>
    <button class="primary-btn" id="saveProfile">save changes</button>
  </div>
</div>

<div class="overlay" id="collOverlay">
  <div class="sheet">
    <h3>new collection</h3>
    <span class="field-label">name</span>
    <input type="text" id="collName" placeholder="e.g. soft mornings">
    <span class="field-label">cover color</span>
    <div class="swatch-row" id="collSwatch"></div>
    <button class="primary-btn" id="saveCollection">create</button>
  </div>
</div>

<script>
// ======================================================
// PASTE YOUR SUPABASE CREDENTIALS BELOW (from Project Settings → API)
// ======================================================
const SUPABASE_URL = "https://iegrsjvwlignbmpzbdxg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IuMi5CvjOyA_B5H_9P0Krg_siG33Rmi";
// ======================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ACCENTS = ["#DE9FA9","#B8AEC7","#AEBB9E","#D8B98C","#9CB8C9"];
const BANNERS = [
  "linear-gradient(135deg,#F3D2D6,#EAC9CE)",
  "linear-gradient(135deg,#DAD4D2,#C7BFBC)",
  "linear-gradient(135deg,#D8B98C,#E7D3B3)",
  "linear-gradient(135deg,#B8AEC7,#D9CFE8)",
  "linear-gradient(135deg,#AEBB9E,#D3DEC7)"
];
const FONTS = [
  {key:"Shippori Mincho", label:"雅 mincho"},
  {key:"Yuji Syuku", label:"筆 syuku"},
  {key:"Klee One", label:"円 klee"}
];
const AVATARS = ["🌸","🍡","🐇","🌙","🍵","🎐","🧸","🍥","🦢","☁️"];
const BOARDS = ["all","soft aesthetics","film photography","cozy rooms","stationery","street style","general"];

let session = null;
let profile = null;
let posts = [];
let likedIds = [];
let repostedIds = [];
let collections = [];
let activeBoard = "all";
let currentPTab = "posts";

// ---------------- AUTH ----------------
let authMode = "login";
document.querySelectorAll("[data-authmode]").forEach(el=>{
  el.onclick = ()=>{
    authMode = el.dataset.authmode;
    document.querySelectorAll("[data-authmode]").forEach(o=>o.classList.remove("sel"));
    el.classList.add("sel");
    document.getElementById("signupFields").style.display = authMode==="signup" ? "block" : "none";
    document.getElementById("authSubmit").textContent = authMode==="signup" ? "create account" : "log in";
    document.getElementById("authError").textContent = "";
  };
});

document.getElementById("authSubmit").onclick = async ()=>{
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const errEl = document.getElementById("authError");
  errEl.textContent = "";
  if(!email || !password){ errEl.textContent = "enter an email and password"; return; }

  if(authMode==="signup"){
    const handle = document.getElementById("authHandle").value.trim();
    if(!handle){ errEl.textContent = "choose a handle"; return; }
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error){ errEl.textContent = error.message; return; }
    if(!data.session){ errEl.textContent = "check your email to confirm, then log in."; return; }
    const { error: profErr } = await sb.from('profiles').insert({
      id: data.user.id, handle, display_name: handle
    });
    if(profErr){ errEl.textContent = profErr.message; return; }
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ errEl.textContent = error.message; return; }
  }
};

document.getElementById("logoutBtn").onclick = async ()=>{
  await sb.auth.signOut();
};

sb.auth.onAuthStateChange(async (_event, newSession)=>{
  session = newSession;
  if(session){
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("app").style.display = "flex";
    await loadEverything();
  } else {
    document.getElementById("authScreen").classList.remove("hidden");
    document.getElementById("app").style.display = "none";
  }
});

// ---------------- DATA LOADING ----------------
async function loadEverything(){
  await loadProfile();
  await loadPosts();
  await loadLikes();
  await loadReposts();
  await loadCollections();
  applyProfileStyles();
  renderFeed();
  renderExplore();
  renderProfile();
}

async function loadProfile(){
  const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  profile = data || {
    display_name:"you", handle:"@you", bio:"", avatar_emoji:"🌸",
    accent_color:ACCENTS[0], banner_style:BANNERS[0], font_choice:FONTS[0].key, now_playing:""
  };
}

async function loadPosts(){
  const { data } = await sb.from('posts')
    .select('*, profiles(display_name, avatar_emoji, accent_color, handle)')
    .order('created_at', { ascending:false });
  posts = data || [];
}

async function loadLikes(){
  const { data } = await sb.from('likes').select('post_id').eq('user_id', session.user.id);
  likedIds = (data||[]).map(l=>l.post_id);
}
async function loadReposts(){
  const { data } = await sb.from('reposts').select('post_id').eq('user_id', session.user.id);
  repostedIds = (data||[]).map(r=>r.post_id);
}
async function loadCollections(){
  const { data } = await sb.from('collections').select('*').eq('owner_id', session.user.id);
  collections = data || [];
}

// ---------------- RENDER ----------------
function avatarEl(color, glyph){ return `<span class="avatar" style="background:${color}22;">${glyph}</span>`; }

function postCardHTML(p){
  const liked = likedIds.includes(p.id);
  const reposted = repostedIds.includes(p.id);
  const authorName = p.profiles ? p.profiles.display_name : "someone";
  const authorAvatar = p.profiles ? p.profiles.avatar_emoji : "🌸";
  const authorColor = p.profiles ? p.profiles.accent_color : "#DE9FA9";
  if(p.post_type === "text"){
    return `<div class="card thread-card" data-id="${p.id}">
      <div class="body">
        <div class="meta">${avatarEl(authorColor, authorAvatar)}${authorName} · ${p.board||'general'}</div>
        <div class="cap">${escapeHTML(p.caption||"")}</div>
        <div class="actions">
          <button class="act ${liked?'liked':''}" data-act="like" data-id="${p.id}">${liked?'♥':'♡'} ${liked?'liked':'like'}</button>
          <button class="act ${reposted?'reposted':''}" data-act="repost" data-id="${p.id}">⟲ ${reposted?'reposted':'repost'}</button>
        </div>
      </div>
    </div>`;
  }
  return `<div class="card" data-id="${p.id}">
    ${p.image_url ? `<img class="media" src="${p.image_url}" loading="lazy">` : ""}
    <div class="body">
      <div class="meta">${avatarEl(authorColor, authorAvatar)}${authorName}</div>
      <p class="cap">${escapeHTML(p.caption||"")}</p>
      <div class="actions">
        <button class="act ${liked?'liked':''}" data-act="like" data-id="${p.id}">${liked?'♥':'♡'}</button>
        <button class="act ${reposted?'reposted':''}" data-act="repost" data-id="${p.id}">⟲</button>
      </div>
    </div>
  </div>`;
}
function escapeHTML(str){
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}

function renderFeed(){
  document.getElementById("feed").innerHTML = posts.length
    ? posts.map(postCardHTML).join("")
    : `<div class="empty">no posts yet — tap ＋ to share something</div>`;
}

function renderExplore(){
  document.getElementById("boardTabs").innerHTML = BOARDS.map(b=>
    `<div class="tab-chip ${b===activeBoard?'active':''}" data-board="${b}">${b}</div>`).join("");
  const filtered = posts.filter(p => activeBoard==="all" || p.board===activeBoard);
  document.getElementById("exploreFeed").innerHTML = filtered.length
    ? filtered.map(postCardHTML).join("")
    : `<div class="empty">nothing here yet — be the first to post</div>`;
}

function applyProfileStyles(){
  document.documentElement.style.setProperty("--accent", profile.accent_color);
  document.documentElement.style.setProperty("--accent-soft", profile.accent_color+"33");
}

function renderProfile(){
  document.getElementById("profileBanner").style.background = profile.banner_style;
  document.getElementById("pAvatar").style.background = profile.accent_color+"33";
  document.getElementById("pAvatar").textContent = profile.avatar_emoji;
  document.getElementById("pName").textContent = profile.display_name;
  document.getElementById("pName").style.fontFamily = `"${profile.font_choice}", serif`;
  document.getElementById("pHandle").textContent = "@"+profile.handle;
  document.getElementById("pBio").textContent = profile.bio || "";
  const npBox = document.getElementById("nowPlayingBox");
  if(profile.now_playing){
    npBox.style.display="flex";
    npBox.innerHTML = `<div class="bars"><span></span><span></span><span></span></div><span>now playing · ${escapeHTML(profile.now_playing)}</span>`;
  } else { npBox.style.display="none"; }
  renderProfileTab(currentPTab);
}

function renderProfileTab(tab){
  currentPTab = tab;
  document.querySelectorAll(".p-tab").forEach(el=>el.classList.toggle("active", el.dataset.ptab===tab));
  const box = document.getElementById("pTabContent");
  const myPosts = posts.filter(p => p.author_id === session.user.id);
  if(tab==="posts"){
    box.innerHTML = myPosts.length===0
      ? `<div class="empty">no posts yet</div>`
      : `<div class="grid3">` + myPosts.map(p=>
          `<div class="cell" style="background:${p.image_url?'transparent':profile.accent_color+'55'};display:flex;align-items:center;justify-content:center;font-size:10px;padding:4px;text-align:center;overflow:hidden;">
            ${p.image_url ? `<img src="${p.image_url}">` : escapeHTML((p.caption||"").slice(0,40))}
          </div>`).join("") + `</div>`;
  } else if(tab==="collections"){
    box.innerHTML = `<div class="collections-grid">` +
      collections.map(c=>`<div class="collection-card" style="background:${c.color};"><div class="cname">${escapeHTML(c.name)}</div></div>`).join("") +
      `<div class="add-collection" id="addCollectionBtn">+ new collection</div></div>`;
    document.getElementById("addCollectionBtn").onclick = ()=>toggleOverlay("collOverlay", true);
  } else {
    const reposted = posts.filter(p=>repostedIds.includes(p.id));
    box.innerHTML = reposted.length
      ? `<div class="feed">${reposted.map(postCardHTML).join("")}</div>`
      : `<div class="empty">nothing reposted yet</div>`;
  }
}

// ---------------- INTERACTIONS ----------------
document.body.addEventListener("click", async (e)=>{
  const act = e.target.closest("[data-act]");
  if(act){
    const id = act.dataset.id, type = act.dataset.act;
    if(type==="like") await toggleLike(id);
    if(type==="repost") await toggleRepost(id);
    return;
  }
  const boardChip = e.target.closest("[data-board]");
  if(boardChip){ activeBoard = boardChip.dataset.board; renderExplore(); return; }
  const navBtn = e.target.closest(".nav-btn[data-screen]");
  if(navBtn){ showScreen(navBtn.dataset.screen); return; }
  const pTab = e.target.closest(".p-tab");
  if(pTab){ renderProfileTab(pTab.dataset.ptab); return; }
});

async function toggleLike(postId){
  const liked = likedIds.includes(postId);
  if(liked){
    await sb.from('likes').delete().eq('user_id', session.user.id).eq('post_id', postId);
    likedIds = likedIds.filter(id=>id!==postId);
  } else {
    await sb.from('likes').insert({ user_id: session.user.id, post_id: postId });
    likedIds.push(postId);
  }
  renderFeed(); renderExplore(); renderProfileTab(currentPTab);
}
async function toggleRepost(postId){
  const reposted = repostedIds.includes(postId);
  if(reposted){
    await sb.from('reposts').delete().eq('user_id', session.user.id).eq('post_id', postId);
    repostedIds = repostedIds.filter(id=>id!==postId);
  } else {
    await sb.from('reposts').insert({ user_id: session.user.id, post_id: postId });
    repostedIds.push(postId);
  }
  renderFeed(); renderExplore(); renderProfileTab(currentPTab);
}

function showScreen(name){
  ["home","explore","profile"].forEach(s=>{
    document.getElementById("screen-"+s).classList.toggle("hidden", s!==name);
  });
  document.querySelectorAll(".nav-btn[data-screen]").forEach(b=>{
    b.classList.toggle("active", b.dataset.screen===name);
  });
}

function toggleOverlay(id, show){ document.getElementById(id).classList.toggle("show", show); }
document.body.addEventListener("click",(e)=>{
  if(e.target.matches("#composeOverlay")) toggleOverlay("composeOverlay", false);
  if(e.target.matches("#editOverlay")) toggleOverlay("editOverlay", false);
  if(e.target.matches("#collOverlay")) toggleOverlay("collOverlay", false);
});

// ---------------- COMPOSE ----------------
let composeType = "text";
document.getElementById("composeBtn").onclick = ()=>{
  document.getElementById("composeBoards").innerHTML = BOARDS.slice(1).map((b,i)=>
    `<div class="tab-chip ${i===0?'active':''}" data-cboard="${b}">${b}</div>`).join("");
  document.getElementById("composeError").textContent = "";
  toggleOverlay("composeOverlay", true);
};
document.querySelectorAll("[data-ctype]").forEach(el=>{
  el.onclick = ()=>{
    document.querySelectorAll("[data-ctype]").forEach(o=>o.classList.remove("sel"));
    el.classList.add("sel"); composeType = el.dataset.ctype;
    document.getElementById("imageUploadWrap").style.display = composeType==="image" ? "block" : "none";
  };
});
document.getElementById("composeImageFile").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  const preview = document.getElementById("composePreview");
  if(file){
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  } else {
    preview.style.display = "none";
  }
});
document.body.addEventListener("click",(e)=>{
  const cb = e.target.closest("[data-cboard]");
  if(cb){ document.querySelectorAll("[data-cboard]").forEach(o=>o.classList.remove("active")); cb.classList.add("active"); }
});
document.getElementById("submitPost").onclick = async ()=>{
  const text = document.getElementById("composeText").value.trim();
  const errEl = document.getElementById("composeError");
  const submitBtn = document.getElementById("submitPost");
  errEl.textContent = "";
  if(!text){ errEl.textContent = "write something first"; return; }

  let imageUrl = null;
  const fileInput = document.getElementById("composeImageFile");
  const file = fileInput.files[0];

  if(composeType==="image"){
    if(!file){ errEl.textContent = "choose a photo"; return; }
    submitBtn.textContent = "uploading...";
    submitBtn.disabled = true;
    const filePath = `${session.user.id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.]/g,'_')}`;
    const { error: uploadError } = await sb.storage.from('post-images').upload(filePath, file);
    if(uploadError){
      errEl.textContent = uploadError.message;
      submitBtn.textContent = "post it"; submitBtn.disabled = false;
      return;
    }
    const { data: urlData } = sb.storage.from('post-images').getPublicUrl(filePath);
    imageUrl = urlData.publicUrl;
  }

  const boardEl = document.querySelector("[data-cboard].active");
  const board = boardEl ? boardEl.dataset.cboard : BOARDS[1];
  const { error } = await sb.from('posts').insert({
    author_id: session.user.id,
    post_type: composeType,
    caption: text,
    image_url: imageUrl,
    board
  });
  submitBtn.textContent = "post it"; submitBtn.disabled = false;
  if(error){ errEl.textContent = error.message; return; }

  document.getElementById("composeText").value = "";
  fileInput.value = "";
  document.getElementById("composePreview").style.display = "none";
  toggleOverlay("composeOverlay", false);
  await loadPosts();
  renderFeed(); renderExplore(); renderProfileTab(currentPTab);
};

// ---------------- EDIT PROFILE ----------------
document.getElementById("editProfileBtn").onclick = ()=>{
  document.getElementById("editName").value = profile.display_name || "";
  document.getElementById("editBio").value = profile.bio || "";
  document.getElementById("editSong").value = profile.now_playing || "";
  document.getElementById("avatarPicker").innerHTML = AVATARS.map(a=>
    `<div class="emoji-opt ${a===profile.avatar_emoji?'sel':''}" data-avatar="${a}">${a}</div>`).join("");
  document.getElementById("accentPicker").innerHTML = ACCENTS.map(c=>
    `<div class="swatch ${c===profile.accent_color?'sel':''}" data-accent="${c}" style="background:${c}"></div>`).join("");
  document.getElementById("bannerPicker").innerHTML = BANNERS.map(b=>
    `<div class="banner-opt ${b===profile.banner_style?'sel':''}" data-banner="${b}" style="background:${b}"></div>`).join("");
  document.getElementById("fontPicker").innerHTML = FONTS.map(f=>
    `<div class="font-opt ${f.key===profile.font_choice?'sel':''}" data-font="${f.key}" style="font-family:'${f.key}',serif;">${f.label}</div>`).join("");
  toggleOverlay("editOverlay", true);
};
document.body.addEventListener("click",(e)=>{
  const av = e.target.closest("[data-avatar]");
  if(av){ document.querySelectorAll("[data-avatar]").forEach(o=>o.classList.remove("sel")); av.classList.add("sel"); }
  const ac = e.target.closest("[data-accent]");
  if(ac){ document.querySelectorAll("[data-accent]").forEach(o=>o.classList.remove("sel")); ac.classList.add("sel"); }
  const bn = e.target.closest("[data-banner]");
  if(bn){ document.querySelectorAll("[data-banner]").forEach(o=>o.classList.remove("sel")); bn.classList.add("sel"); }
  const ft = e.target.closest("[data-font]");
  if(ft){ document.querySelectorAll("[data-font]").forEach(o=>o.classList.remove("sel")); ft.classList.add("sel"); }
});
document.getElementById("saveProfile").onclick = async ()=>{
  const av = document.querySelector("[data-avatar].sel");
  const ac = document.querySelector("[data-accent].sel");
  const bn = document.querySelector("[data-banner].sel");
  const ft = document.querySelector("[data-font].sel");
  const updates = {
    display_name: document.getElementById("editName").value || profile.display_name,
    bio: document.getElementById("editBio").value,
    now_playing: document.getElementById("editSong").value,
    avatar_emoji: av ? av.dataset.avatar : profile.avatar_emoji,
    accent_color: ac ? ac.dataset.accent : profile.accent_color,
    banner_style: bn ? bn.dataset.banner : profile.banner_style,
    font_choice: ft ? ft.dataset.font : profile.font_choice
  };
  const { error } = await sb.from('profiles').update(updates).eq('id', session.user.id);
  if(error){ alert(error.message); return; }
  profile = { ...profile, ...updates };
  applyProfileStyles(); renderProfile();
  toggleOverlay("editOverlay", false);
};

// ---------------- COLLECTIONS ----------------
document.getElementById("collSwatch").innerHTML = ACCENTS.map(c=>
  `<div class="swatch" data-collcolor="${c}" style="background:${c}"></div>`).join("");
document.body.addEventListener("click",(e)=>{
  const cc = e.target.closest("[data-collcolor]");
  if(cc){ document.querySelectorAll("[data-collcolor]").forEach(o=>o.classList.remove("sel")); cc.classList.add("sel"); }
});
document.getElementById("saveCollection").onclick = async ()=>{
  const name = document.getElementById("collName").value.trim();
  if(!name) return;
  const colorEl = document.querySelector("[data-collcolor].sel");
  const color = colorEl ? colorEl.dataset.collcolor : ACCENTS[0];
  const { error } = await sb.from('collections').insert({ owner_id: session.user.id, name, color });
  if(error){ alert(error.message); return; }
  document.getElementById("collName").value = "";
  toggleOverlay("collOverlay", false);
  await loadCollections();
  renderProfileTab("collections");
};

// ---------------- INIT: check for existing session ----------------
sb.auth.getSession().then(({ data })=>{
  session = data.session;
  if(session){
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("app").style.display = "flex";
    loadEverything();
  }
});
</script>
</body>
</html>
